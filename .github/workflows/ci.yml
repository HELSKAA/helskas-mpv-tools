name: CI

# Runs only the pure-Python unit tests for the tone-colour helper. Nothing in
# this workflow touches the Lua runtime.
on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pypinyin
      - name: Run unit tests
        run: python -m pytest tests -q
